name: Trace CI

on:
  push:
    branches: [recorder/dev]
  pull_request:
    branches: [recorder/dev, main]
  workflow_dispatch:
    inputs:
      package_candidate:
        description: Build and inspect a private Windows engineering candidate
        type: boolean
        default: false
  workflow_call:
    inputs:
      package_candidate:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - run: npm run check:independence
      - run: npm run typecheck
      - run: npm run test:trace
      - run: npm run build:trace
      - name: Portable C++ with ASan and UBSan
        run: |
          cmake -S native/portable -B build/trace-portable -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTRACE_SANITIZE=ON -DTRACE_REQUIRE_EBU=ON
          cmake --build build/trace-portable --parallel 4
          ctest --test-dir build/trace-portable --parallel 2 -E '^ebu_wav$' --output-on-failure --output-junit portable-core-results.xml
          ctest --test-dir build/trace-portable -R '^ebu_wav$' --output-on-failure --output-junit ebu-wav-results.xml
      - name: Actual React subscription regression in Chromium
        run: node tools/audit/snapshot-selector.cjs
        env:
          TRACE_AUDIT_CHROMIUM: google-chrome
      - name: Renderer interactions with simulated IPC
        run: node tools/audit/renderer.cjs
        env:
          TRACE_AUDIT_CHROMIUM: google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-portable-evidence
          path: |
            build/trace-portable/portable-core-results.xml
            build/trace-portable/ebu-wav-results.xml
            build/trace-portable/ebu-wav-results.json
            artifacts/cloud-regression/selector-*/result.json
            artifacts/release-cloud/renderer-*/report.json
          if-no-files-found: warn

  windows:
    needs: portable
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - run: npm run check:independence
      - name: Fetch pinned Electron SDK without building another application
        run: npm run install:trace-sdk
      - name: Compile independent Trace diagnostic fixtures
        run: npm run build:trace-diagnostics
      - run: node tools/prefetch-ffmpeg.mjs
      - name: Verify Trace and retain command outcomes
        run: node tools/release/verify.cjs
        env:
          TRACE_REQUIRE_NATIVE: '1'
      - name: Build and inspect candidate package
        if: inputs.package_candidate == true
        run: |
          node tools/package-trace.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/m6/package-audit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/release/package-load-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/release/candidate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-windows-evidence
          path: |
            artifacts/release/verification.json
            artifacts/release/package-load.json
            artifacts/m6/package-audit-latest.json
            build/trace-engine/Testing/Temporary/LastTest.log
            build/trace-engine/ebu-wav-results.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: inputs.package_candidate == true
        with:
          name: trace-windows-candidate
          path: dist-trace/candidate/*
          if-no-files-found: error
